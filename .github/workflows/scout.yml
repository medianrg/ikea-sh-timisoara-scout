name: IKEA SH TM

on:
  schedule:
    - cron: "0 */3 * * *"
    - cron: "30 1-23/3 * * *"
  workflow_dispatch:
    inputs:
      check_scrape_only:
        description: "Test Firecrawl extraction without database writes or email"
        type: boolean
        default: false
      preview_email:
        description: "Send a 4-product email preview without database writes"
        type: boolean
        default: false


jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Validate manual options
        if: ${{ inputs.check_scrape_only == true && inputs.preview_email == true }}
        run: |
          echo "Choose either check_scrape_only or preview_email."
          exit 1
      - name: Check Firecrawl extraction
        if: ${{ inputs.check_scrape_only == true }}
        run: npm run check:scrape
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      - name: Send email preview
        if: ${{ inputs.preview_email == true }}
        run: node scripts/preview-email-live.js
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      - name: Run scout
        if: ${{ inputs.check_scrape_only != true && inputs.preview_email != true }}
        run: node scout.js
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_MODE: ${{ secrets.NOTIFY_MODE }}
